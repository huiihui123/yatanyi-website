<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的购物车 - 雅檀怡家私城</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #8B5E3C; --primary-dark: #6B3F23; --secondary: #C67B4B;
  --accent: #E8C9A0; --bg: #F5F0EB; --white: #fff; --dark: #3E2723;
  --text: #2C1810; --text-light: #8D6E63; --border: #E0D6CC;
  --danger: #E53935; --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Noto Sans SC','Microsoft YaHei',sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }

.topbar {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 40px; height: 56px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.topbar .logo { font-size: 1.2rem; font-weight: 700; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.topbar .logo i { font-size: 1.3rem; }
.topbar .links { display: flex; gap: 24px; align-items: center; }
.topbar .links a { color: var(--text-light); text-decoration: none; font-size: 0.9rem; }
.topbar .links a:hover { color: var(--primary); }

.main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
.page-title { font-size: 1.6rem; font-weight: 700; color: var(--dark); margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
.page-title .count { font-size: 0.9rem; color: var(--text-light); font-weight: 400; }

.cart-table { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
.cart-header { display: grid; grid-template-columns: 50px 2fr 1fr 1fr 1fr 60px; padding: 16px 20px; background: #FAF7F2; border-bottom: 1px solid var(--border); font-size: 0.85rem; color: var(--text-light); font-weight: 600; align-items: center; }
.cart-item { display: grid; grid-template-columns: 50px 2fr 1fr 1fr 1fr 60px; padding: 20px; border-bottom: 1px solid #F5F0EB; align-items: center; transition: background 0.2s; }
.cart-item:hover { background: #FDFAF5; }
.cart-item:last-child { border-bottom: none; }
.cart-checkbox input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
.cart-product { display: flex; gap: 14px; align-items: center; }
.cart-product img { width: 80px; height: 80px; object-fit: contain; border-radius: 8px; background: #FDF8F0; }
.cart-product .info h4 { font-size: 0.95rem; color: var(--dark); margin-bottom: 4px; }
.cart-product .info p { font-size: 0.8rem; color: var(--text-light); }
.cart-price { font-weight: 600; color: var(--dark); font-size: 0.95rem; }
.cart-qty { display: flex; align-items: center; gap: 0; }
.cart-qty button { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--white); cursor: pointer; font-size: 1rem; color: var(--text); transition: all 0.2s; }
.cart-qty button:hover { background: var(--primary); color: white; border-color: var(--primary); }
.cart-qty button:first-child { border-radius: 6px 0 0 6px; }
.cart-qty button:last-child { border-radius: 0 6px 6px 0; }
.cart-qty span { width: 44px; height: 32px; display: flex; align-items: center; justify-content: center; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 0.9rem; }
.cart-subtotal { font-weight: 700; color: var(--danger); font-size: 0.95rem; }
.cart-delete { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1.1rem; transition: color 0.2s; }
.cart-delete:hover { color: var(--danger); }

.cart-footer { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; background: #FAF7F2; border-top: 1px solid var(--border); }
.cart-footer .select-all { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-light); }
.cart-footer .summary { display: flex; align-items: center; gap: 24px; }
.cart-footer .summary .total-label { font-size: 0.9rem; color: var(--text-light); }
.cart-footer .summary .total-price { font-size: 1.5rem; font-weight: 700; color: var(--danger); }
.cart-footer .summary .total-price small { font-size: 0.9rem; }
.btn-checkout {
  padding: 14px 48px; background: var(--danger); color: white; border: none;
  border-radius: 30px; font-size: 1.05rem; font-weight: 600; cursor: pointer;
  transition: all 0.3s; letter-spacing: 1px;
}
.btn-checkout:hover { background: #C62828; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(229,57,53,0.3); }
.btn-checkout:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

.empty-cart { text-align: center; padding: 80px 20px; }
.empty-cart i { font-size: 5rem; color: #E0D6CC; margin-bottom: 20px; display: block; }
.empty-cart h3 { font-size: 1.3rem; color: var(--text-light); margin-bottom: 8px; }
.empty-cart p { color: #bbb; margin-bottom: 24px; }
.empty-cart a { display: inline-block; padding: 12px 36px; background: var(--primary); color: white; text-decoration: none; border-radius: 30px; font-weight: 600; }

.toast { position: fixed; top: 20px; right: 20px; background: var(--dark); color: white; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; z-index: 9999; display: none; }
.toast.show { display: block; }
.toast.success { background: #2E7D32; }

/* ====== 需求3：结算确认对话框样式（与全站确认框风格一致） ====== */
.confirm-layer { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.45); z-index: 10000; display: flex; align-items: center; justify-content: center; }
.confirm-box { background:#fff; border-radius:12px; max-width:400px; width:90%; padding:28px 24px; text-align:center; animation:fadeInUp .25s; box-shadow:0 12px 40px rgba(0,0,0,0.25); }
.confirm-box h3 { color:#3E2723; font-size:1.15rem; margin:0 0 10px; }
.confirm-box p { color:#8D6E63; font-size:0.9rem; line-height:1.7; margin-bottom:22px; word-break:break-all; }
.confirm-box .confirm-icon { font-size:2.2rem; margin-bottom:10px; }
.confirm-box .confirm-actions { display:flex; gap:12px; }
.confirm-box .confirm-actions button { flex:1; padding:12px; border:none; border-radius:8px; cursor:pointer; font-size:1rem; transition:all .2s; }
.confirm-box .btn-cancel { background:#EFE7DF; color:#6D4C41; }
.confirm-box .btn-cancel:hover { background:#E3D5C8; }
.confirm-box .btn-ok { background:#8B5E3C; color:#fff; }
.confirm-box .btn-ok:hover { background:#6B3F23; }
.confirm-box .btn-ok.danger { background:#e74c3c; }
.confirm-box .btn-ok.danger:hover { background:#c0392b; }
@keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

@media (max-width: 768px) {
  .topbar { padding: 0 16px; }
  .cart-header { display: none; }
  .cart-item { grid-template-columns: 1fr; gap: 12px; padding: 16px; }
  .cart-product img { width: 60px; height: 60px; }
  .cart-footer { flex-direction: column; gap: 16px; }
  .btn-checkout { width: 100%; }
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/index.html" class="logo"><i class="fas fa-couch"></i> 雅檀怡家私城</a>
  <div class="links">
    <a href="/index.html"><i class="fas fa-home"></i> 首页</a>
    <a href="/index.html#products"><i class="fas fa-th"></i> 产品</a>
    <span id="userLink" style="cursor:pointer;color:var(--text-light);font-size:0.9rem;"></span>
  </div>
</div>

<div class="main">
  <div class="page-title">
    <i class="fas fa-shopping-cart" style="color:var(--primary);"></i>
    我的购物车
    <span class="count" id="cartCount"></span>
  </div>

  <div id="cartContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ★ 同源 API：由 Flask 托管时自动适配，避免硬编码 localhost 导致生产环境连不上
const API = (location.origin.includes('localhost') || location.origin.includes('127.0.0.1') || location.port === '5000')
  ? (location.origin + '/api') : '/api';
let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('yatan_user') || 'null'); } catch(e) { currentUser = null; }
let cartItems = [];

function $(s) { return document.querySelector(s); }

// ====== 需求3：结算确认对话框（确认/取消，确认后执行回调） ======
function showConfirmDialog(opts) {
  // 参数：{ icon, title, message, confirmText, cancelText, danger, onConfirm }
  const layer = document.createElement('div');
  layer.className = 'confirm-layer';
  // 组装确认框内容：图标 + 标题 + 说明 + 取消/确认按钮
  layer.innerHTML = '<div class="confirm-box">'
    + '<div class="confirm-icon">' + (opts.icon || '❓') + '</div>'
    + '<h3>' + (opts.title || '') + '</h3>'
    + (opts.message ? '<p>' + opts.message + '</p>' : '')
    + '<div class="confirm-actions">'
    + '<button class="btn-cancel">' + (opts.cancelText || '取消') + '</button>'
    + '<button class="btn-ok' + (opts.danger ? ' danger' : '') + '">' + (opts.confirmText || '确认') + '</button>'
    + '</div></div>';
  document.body.appendChild(layer);
  // 事件绑定：点遮罩=取消，点按钮=取消/确认
  layer.addEventListener('click', function(e) {
    if (e.target === layer) { layer.remove(); return; }
    if (e.target.classList.contains('btn-cancel')) { layer.remove(); return; }
    if (e.target.classList.contains('btn-ok')) {
      layer.remove();
      if (typeof opts.onConfirm === 'function') opts.onConfirm();
    }
  });
}
function showToast(m, isError) { let t=$('#toast'); t.textContent=m; t.className='toast show' + (isError?'':' success'); setTimeout(()=>t.classList.remove('show'),2000); }

// ★ BUG修复：原先 updateTotal/toggleAll 从未定义，勾选/全选直接报错、合计不变
function escapeHtml(s) {
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function updateTotal() {
  let checked = [...document.querySelectorAll('.cart-item .cart-checkbox input')];
  let total = 0;
  cartItems.forEach((item, idx) => {
    if (checked[idx] && checked[idx].checked) total += item.product_price * item.quantity;
  });
  $('#totalPrice').textContent = total.toLocaleString();
  let btn = document.querySelector('.btn-checkout');
  if (btn) btn.disabled = total <= 0;
}
function toggleAll(el) {
  document.querySelectorAll('.cart-item .cart-checkbox input').forEach(c => c.checked = el.checked);
  updateTotal();
}

async function loadCart() {
  if (!currentUser) {
    $('#cartContent').innerHTML = `<div class="empty-cart">
      <i class="fas fa-user-lock"></i><h3>请先登录</h3><p>登录后查看购物车</p>
      <a href="/index.html" onclick="localStorage.setItem('showLogin','1')">去登录</a></div>`;
    return;
  }
  try {
    let r = await fetch(API + '/cart?user_id=' + currentUser.id);
    let d = await r.json();
    cartItems = d.items || [];
    renderCart();
  } catch(e) {
    $('#cartContent').innerHTML = '<div class="empty-cart"><i class="fas fa-wifi"></i><h3>加载失败</h3><p>请检查网络连接</p></div>';
  }
}

function renderCart() {
  if (!cartItems.length) {
    $('#cartContent').innerHTML = `<div class="empty-cart">
      <i class="fas fa-shopping-cart"></i><h3>购物车是空的</h3><p>快去挑选心仪的家具吧~</p>
      <a href="/index.html#products">去逛逛</a></div>`;
    return;
  }

  let total = cartItems.reduce((s,i) => s + i.product_price * i.quantity, 0);
  $('#cartCount').textContent = `（共 ${cartItems.length} 件）`;

  $('#cartContent').innerHTML = `
    <div class="cart-table">
      <div class="cart-header">
        <span>全选</span><span>商品信息</span><span>单价</span><span>数量</span><span>小计</span><span></span>
      </div>
      ${cartItems.map((item, idx) => `
        <div class="cart-item">
          <div class="cart-checkbox"><input type="checkbox" checked onchange="updateTotal()"></div>
          <div class="cart-product">
            <img src="${escapeHtml(item.image_url || '')}" alt="${escapeHtml(item.product_name)}" onerror="this.style.display='none'">
            <div class="info"><h4>${escapeHtml(item.product_name)}</h4></div>
          </div>
          <div class="cart-price">¥${Number(item.product_price).toLocaleString()}</div>
          <div class="cart-qty">
            <button type="button" onclick="changeQty(${item.id}, ${item.quantity-1})">−</button>
            <span>${item.quantity}</span>
            <button type="button" onclick="changeQty(${item.id}, ${item.quantity+1})">+</button>
          </div>
          <div class="cart-subtotal">¥${(item.product_price * item.quantity).toLocaleString()}</div>
          <button type="button" class="cart-delete" onclick="removeItem(${item.id})" title="删除">✕</button>
        </div>
      `).join('')}
      <div class="cart-footer">
        <div class="select-all"><input type="checkbox" checked onchange="toggleAll(this)"> 全选</div>
        <div class="summary">
          <span class="total-label">合计：</span>
          <span class="total-price">¥<span id="totalPrice">${total.toLocaleString()}</span></span>
          <button type="button" class="btn-checkout" onclick="checkout()">去结算</button>
        </div>
      </div>
    </div>`;
}

async function changeQty(cid, qty) {
  if (qty < 1) { removeItem(cid); return; }
  try {
    let r = await fetch(API + '/cart/' + cid, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({quantity:qty}) });
    if (!r.ok) { showToast('修改失败', true); return; }
    await loadCart();
  } catch(e) { showToast('网络错误', true); }
}

async function removeItem(cid) {
  // 需求4：删除确认统一使用自定义对话框（替代原生 confirm，交互风格一致）
  showConfirmDialog({
    icon: '🗑️',
    title: '确定删除该商品？',
    confirmText: '删除',
    cancelText: '取消',
    danger: true,   // 危险操作：确认按钮红色警示
    onConfirm: async function() {
      try {
        let r = await fetch(API + '/cart/' + cid, { method:'DELETE' });
        if (!r.ok) { showToast('删除失败', true); return; }
        showToast('已删除');
        await loadCart();
      } catch(e) { showToast('网络错误', true); }
    }
  });
}

async function checkout() {
  if (!currentUser) return alert('请先登录');
  // 需求3：去结算前弹出确认对话框「您是否将确认前往购买？」
  //   确认 → 生成订单 + 弹出微信二维码；取消 → 停留在购物车页
  showConfirmDialog({
    icon: '💳',
    title: '您是否将确认前往购买？',
    message: '确认后将为您生成订单，并通过微信扫码联系客服完成付款。',
    confirmText: '确认购买',
    cancelText: '取消',
    onConfirm: async function() {
      try {
        // ★ BUG修复：统一用 username（与首页 checkout 一致），避免同一订单落库姓名不一致
        let r = await fetch(API + '/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user_id:currentUser.id, username:currentUser.username}) });
        let d = await r.json();
        if (d.success) {
      showToast('下单成功！共 ¥' + d.total);
      // 弹窗微信二维码15s
      let secs = 15;
      let overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;';
      overlay.innerHTML = `<div style="background:white;border-radius:16px;padding:40px;text-align:center;max-width:400px;width:90%;">
        <h2 style="color:#3E2723;margin-bottom:8px;">✅ ${d.message}</h2>
        <p style="color:#8D6E63;margin-bottom:24px;">请扫码联系客服确认订单</p>
        <div style="background:#FDF8F0;padding:24px;border-radius:12px;display:inline-block;">
          <!-- ★ BUG修复：原 images/bbb.jpg 是个人照片，改为真正的微信二维码 ytyjs.jpg -->
          <img src="images/ytyjs.jpg" style="width:200px;height:200px;object-fit:contain;" onerror="this.src='https://via.placeholder.com/200/8B5E3C/fff?text=WeChat'">
          <p style="color:#8B5E3C;font-weight:700;margin-top:16px;">微信扫码添加客服</p>
        </div>
        <p id="qrTimer" style="color:#e74c3c;font-size:1.2rem;margin-top:16px;">窗口将在 <b>${secs}</b> 秒后关闭</p>
        <button onclick="this.parentElement.parentElement.remove()" style="margin-top:16px;padding:10px 30px;background:#D7CCC8;border:none;border-radius:8px;cursor:pointer;font-size:0.9rem;">手动关闭</button>
      </div>`;
      document.body.appendChild(overlay);
      let timer = setInterval(() => {
        secs--;
        let el = document.getElementById('qrTimer');
        if (el) el.innerHTML = `窗口将在 <b>${secs}</b> 秒后关闭`;
        if (secs <= 0) { clearInterval(timer); overlay.remove(); }
      }, 1000);
        setTimeout(() => loadCart(), 500);
        } else {
          alert(d.message);
        }
      } catch(e) { alert('下单失败，请重试'); }
    }   // ← onConfirm 回调结束
  });   // ← showConfirmDialog 调用结束
}   // ← checkout 函数结束

function updateUserUI() {
  let el = $('#userLink');
  if (!el) return;
  if (currentUser) {
    el.innerHTML = `<i class="fas fa-user-circle"></i> ${currentUser.nickname||currentUser.username}`;
    el.onclick = () => location.href = '/profile.html';
  } else {
    el.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登录';
    el.onclick = () => location.href = '/index.html';
  }
}

loadCart();
updateUserUI();
</script>
</body>
</html>
