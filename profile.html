<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 雅檀怡家私城</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #8B5E3C; --primary-dark: #6B3F23; --secondary: #C67B4B;
  --accent: #E8C9A0; --bg: #F5F0EB; --white: #fff; --dark: #3E2723;
  --text: #2C1810; --text-light: #8D6E63; --border: #E0D6CC;
  --danger: #E53935; --success: #4CAF50; --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Noto Sans SC','Microsoft YaHei',sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }

.topbar {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 40px; height: 56px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.topbar .logo { font-size: 1.2rem; font-weight: 700; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.topbar .links { display: flex; gap: 24px; align-items: center; }
.topbar .links a { color: var(--text-light); text-decoration: none; font-size: 0.9rem; }
.topbar .links a:hover,.topbar .links span:hover { color: var(--primary); }
.topbar .links span { cursor: pointer; }

.main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; display: grid; grid-template-columns: 280px 1fr; gap: 28px; }

/* 左侧菜单 */
.sidebar { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.06); height: fit-content; position: sticky; top: 80px; }
.sidebar .user-card { padding: 28px 20px; text-align: center; border-bottom: 1px solid var(--border); }
.sidebar .user-card .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); margin-bottom: 12px; }
.sidebar .user-card .avatar-placeholder { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; margin-bottom: 12px; }
.sidebar .user-card h3 { font-size: 1.1rem; color: var(--dark); margin-bottom: 4px; }
.sidebar .user-card p { font-size: 0.8rem; color: var(--text-light); }
.sidebar-nav { padding: 8px 0; }
.sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: var(--text); text-decoration: none; font-size: 0.95rem; transition: all 0.2s; }
.sidebar-nav a:hover, .sidebar-nav a.active { background: #FDF8F0; color: var(--primary); font-weight: 600; }
.sidebar-nav a i { width: 20px; text-align: center; font-size: 1.1rem; }

/* 右侧内容 */
.content { background: var(--white); border-radius: var(--radius); box-shadow: 0 2px 16px rgba(0,0,0,0.06); padding: 32px; }
.content h2 { font-size: 1.3rem; color: var(--dark); margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--accent); display: flex; align-items: center; gap: 10px; }

/* 表单 */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: 0.85rem; color: var(--text-light); font-weight: 500; }
.form-group input, .form-group select, .form-group textarea {
  padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 0.95rem; font-family: inherit; transition: border 0.2s; outline: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
.form-group textarea { resize: vertical; min-height: 80px; }
.btn { padding: 12px 32px; border: none; border-radius: 30px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { background: var(--white); color: var(--danger); border: 1px solid var(--danger); }
.btn-danger:hover { background: var(--danger); color: white; }

/* 订单列表 */
.order-card { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
.order-header { display: flex; justify-content: space-between; padding: 14px 20px; background: #FAF7F2; font-size: 0.85rem; color: var(--text-light); border-bottom: 1px solid var(--border); }
.order-body { padding: 16px 20px; }
.order-items { display: flex; flex-wrap: wrap; gap: 12px; }
.order-item { display: flex; align-items: center; gap: 10px; background: #FDF8F0; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; }
.order-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.order-total { font-weight: 700; color: var(--danger); font-size: 1rem; }
.status-tag { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
.st-pending { background: #FFF3E0; color: #E65100; }
.st-completed { background: #E8F5E9; color: #2E7D32; }
.empty { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty i { font-size: 3rem; margin-bottom: 16px; display: block; color: #ccc; }

/* 浏览历史 */
.history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.history-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: #fff; transition: all 0.25s; display: flex; flex-direction: column; }
.history-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
.history-card .h-img { height: 130px; background: #FAF7F2; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.history-card .h-img img { width: 100%; height: 100%; object-fit: contain; }
.history-card .h-info { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.history-card .h-name { font-size: 0.92rem; font-weight: 600; color: var(--dark); cursor: pointer; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.history-card .h-name:hover { color: var(--primary); }
.history-card .h-price { color: var(--danger); font-weight: 700; font-size: 1rem; }
.history-card .h-time { font-size: 0.75rem; color: var(--text-light); }
.history-card .h-actions { display: flex; gap: 8px; padding: 0 14px 12px; }
.history-card .h-del { flex: 1; padding: 6px 0; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text-light); font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
.history-card .h-del:hover { border-color: var(--danger); color: var(--danger); }
.history-card .h-off { color: var(--text-light); font-size: 0.78rem; background: #F5F5F5; padding: 2px 8px; border-radius: 4px; align-self: flex-start; }
.history-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
.history-toolbar .h-count { color: var(--text-light); font-size: 0.85rem; }
.history-clear { padding: 8px 18px; border: 1px solid var(--border); border-radius: 20px; background: #fff; color: var(--text-light); font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
.history-clear:hover { border-color: var(--danger); color: var(--danger); }
.toast { position: fixed; top: 20px; right: 20px; background: var(--dark); color: white; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; z-index: 9999; display: none; }
.toast.show { display: block; }

@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; }
  .sidebar { position: static; }
  .form-grid { grid-template-columns: 1fr; }
  .topbar { padding: 0 16px; }
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/index.html" class="logo"><i class="fas fa-couch"></i> 雅檀怡家私城</a>
  <div class="links">
    <a href="/index.html"><i class="fas fa-home"></i> 首页</a>
    <a href="/cart.html"><i class="fas fa-shopping-cart"></i> 购物车</a>
    <span onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> 退出</span>
  </div>
</div>

<div class="main">
  <!-- 左侧菜单 -->
  <aside class="sidebar">
    <div class="user-card">
      <div id="sidebarAvatar"></div>
      <h3 id="sidebarName"></h3>
      <p id="sidebarSig"></p>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="active" onclick="switchSection('profile', this)"><i class="fas fa-user-edit"></i> 个人信息</a>
      <a href="#" onclick="switchSection('orders', this)"><i class="fas fa-clipboard-list"></i> 我的订单</a>
      <a href="#" onclick="switchSection('history', this)"><i class="fas fa-history"></i> 浏览历史</a>
      <a href="#" onclick="switchSection('security', this)"><i class="fas fa-shield-alt"></i> 账户安全</a>
      <a href="/cart.html"><i class="fas fa-shopping-cart"></i> 购物车</a>
    </nav>
  </aside>

  <!-- 右侧内容 -->
  <div class="content" id="contentArea"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ★ 同源 API：由 Flask 托管时自动适配
const API = (location.origin.includes('localhost') || location.origin.includes('127.0.0.1') || location.port === '5000')
  ? (location.origin + '/api') : '/api';
let currentUser = null;
// ★ BUG修复：localStorage 数据损坏会导致整页崩溃白屏
try { currentUser = JSON.parse(localStorage.getItem('yatan_user') || 'null'); } catch(e) { currentUser = null; }
if (!currentUser) { location.href = '/index.html'; }

function $(s){return document.querySelector(s);}
function showToast(m){let t=$('#toast');t.textContent=m;t.className='toast show';setTimeout(()=>t.classList.remove('show'),2000);}
// ★ 图片加载失败兜底占位（纯 data URI，不依赖外部资源）
const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">' +
  '<rect width="100%" height="100%" fill="#F5EFE6"/>' +
  '<text x="50%" y="50%" fill="#B8A88F" font-size="16" text-anchor="middle" dominant-baseline="middle">图片加载失败</text></svg>');
// ★ BUG修复：所有插入 innerHTML 的动态值统一转义，防存储型 XSS
function escapeHtml(s) {
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateSidebar() {
  let av = currentUser.avatar ? `<img src="${currentUser.avatar}" class="avatar" onerror="this.style.display='none'">` 
    : `<div class="avatar-placeholder">${(currentUser.nickname||currentUser.username)[0]}</div>`;
  $('#sidebarAvatar').innerHTML = av;
  $('#sidebarName').textContent = currentUser.nickname || currentUser.username;
  $('#sidebarSig').textContent = currentUser.signature || '还没有签名~';
}

function switchSection(s, el) {
  document.querySelectorAll('.sidebar-nav a').forEach(a=>a.classList.remove('active'));
  if (el) el.classList.add('active');
  if (s==='profile') renderProfile();
  else if (s==='orders') renderOrders();
  else if (s==='history') renderHistory();
  else if (s==='security') renderSecurity();
}

async function renderProfile() {
  try {
    let r = await fetch(API + '/user/profile?user_id=' + currentUser.id);
    let d = await r.json();
    if (!d.success) { $('#contentArea').innerHTML='<div class="empty">加载失败</div>'; return; }
    let u = d.user;
    $('#contentArea').innerHTML = `
      <h2><i class="fas fa-user-edit" style="color:var(--primary);"></i> 个人信息</h2>
      <div class="form-grid">
        <div class="form-group"><label>头像URL</label><input id="pfAvatar" value="${escapeHtml(u.avatar||'')}" placeholder="输入头像图片链接"></div>
        <div class="form-group"><label>昵称</label><input id="pfNick" value="${escapeHtml(u.nickname||'')}"></div>
        <div class="form-group"><label>性别</label><select id="pfGender"><option value="" ${!u.gender?'selected':''}>保密</option><option value="男" ${u.gender==='男'?'selected':''}>男</option><option value="女" ${u.gender==='女'?'selected':''}>女</option></select></div>
        <div class="form-group"><label>年龄</label><input id="pfAge" type="number" value="${escapeHtml(u.age||'')}" min="0" max="150"></div>
        <div class="form-group"><label>手机号</label><input id="pfPhone" value="${escapeHtml(u.phone||'')}"></div>
        <div class="form-group"><label>邮箱</label><input id="pfEmail" value="${escapeHtml(u.email||'')}"></div>
        <div class="form-group"><label>地区</label><input id="pfRegion" value="${escapeHtml(u.region||'')}" placeholder="如：南宁"></div>
        <div class="form-group full"><label>个性签名</label><input id="pfSig" value="${escapeHtml(u.signature||'')}" placeholder="写一句个性签名..."></div>
      </div>
      <div style="display:flex;gap:12px;margin-top:24px;">
        <button class="btn btn-primary" onclick="saveProfile()"><i class="fas fa-save"></i> 保存修改</button>
      </div>`;
  } catch(e) { $('#contentArea').innerHTML='<div class="empty">加载失败</div>'; }
}

async function saveProfile() {
  let data = {
    user_id: currentUser.id,
    avatar: $('#pfAvatar').value, nickname: $('#pfNick').value,
    gender: $('#pfGender').value, age: $('#pfAge').value,
    phone: $('#pfPhone').value, email: $('#pfEmail').value,
    region: $('#pfRegion').value, signature: $('#pfSig').value
  };
  let r = await fetch(API + '/user/profile', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  let d = await r.json();
  if (d.success) {
    Object.assign(currentUser, data);
    localStorage.setItem('yatan_user', JSON.stringify(currentUser));
    updateSidebar();
    showToast('✅ 保存成功');
  } else { alert(d.message); }
}

async function renderOrders() {
  $('#contentArea').innerHTML = '<h2><i class="fas fa-clipboard-list" style="color:var(--primary);"></i> 我的订单</h2><div style="text-align:center;padding:40px;">加载中...</div>';
  try {
    let r = await fetch(API + '/orders?user_id=' + currentUser.id);
    let d = await r.json();
    // ★ BUG修复：接口异常返回（如 401）时 d.orders 可能为 undefined，直接 .length 会崩溃
    if (!d || !d.orders || !d.orders.length) {
      $('#contentArea').innerHTML = '<h2><i class="fas fa-clipboard-list" style="color:var(--primary);"></i> 我的订单</h2><div class="empty"><i class="fas fa-inbox"></i>暂无订单<p style="margin-top:12px;"><a href="/index.html#products" style="color:var(--primary);">去逛逛</a></p></div>';
      return;
    }
    let sm = {pending:'⏳待确认', confirmed:'✅已确认', shipped:'🚚已发货', completed:'✔已完成'};
    let html = '<h2><i class="fas fa-clipboard-list" style="color:var(--primary);"></i> 我的订单</h2>';
    d.orders.forEach(o => {
      // ★ BUG修复：items_json 可能为 null/损坏，JSON.parse 包 try 并降级显示
      let items = [];
      try { items = typeof o.items_json==='string' ? JSON.parse(o.items_json) : (o.items_json||[]); } catch(e) { items = []; }
      html += `<div class="order-card">
        <div class="order-header"><span>订单号：#${escapeHtml(o.id)}</span><span>${escapeHtml((o.created_at||'').substring(0,16))}</span></div>
        <div class="order-body"><div class="order-items">${items.map(i=>`<div class="order-item">${escapeHtml(i.product_name)} ×${i.quantity}</div>`).join('')||'<div class="order-item">（订单数据异常）</div>'}</div></div>
        <div class="order-footer"><span class="status-tag ${o.status==='pending'?'st-pending':'st-completed'}">${escapeHtml(sm[o.status]||o.status)}</span><span class="order-total">合计：¥${Number(o.total_amount).toLocaleString()}</span></div>
      </div>`;
    });
    $('#contentArea').innerHTML = html;
  } catch(e) { $('#contentArea').innerHTML = '<h2>我的订单</h2><div class="empty">加载失败</div>'; }
}

// ====== 浏览历史（纯前端 localStorage：零网络请求、即时渲染）======
const HISTORY_KEY = 'yatan_history';

/** 读取本地浏览历史 */
function getHistoryList() {
  try {
    let list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}

function renderHistory() {
  const list = getHistoryList();
  if (!list.length) {
    $('#contentArea').innerHTML = '<h2><i class="fas fa-history" style="color:var(--primary);"></i> 浏览历史</h2><div class="empty"><i class="fas fa-eye-slash"></i>暂无浏览记录<p style="margin-top:12px;"><a href="/index.html#products" style="color:var(--primary);">去逛逛</a></p></div>';
    return;
  }
  let html = '<h2><i class="fas fa-history" style="color:var(--primary);"></i> 浏览历史</h2>';
  html += `<div class="history-toolbar"><span class="h-count">共 ${list.length} 条浏览记录</span><button class="history-clear" onclick="clearHistory()"><i class="fas fa-trash-alt"></i> 清空全部</button></div>`;
  html += '<div class="history-grid">';
  list.forEach(h => {
    // 存的是浏览时快照：商品下架/删除后历史仍可查看；绝对路径 + 失败兜底占位
    const img = h.image ? `<img src="${escapeHtml(h.image)}" alt="${escapeHtml(h.name)}" loading="lazy" onerror="this.onerror=null;this.src=FALLBACK_IMG">` : '';
    html += `<div class="history-card">
      <div class="h-img" onclick="goProduct(${h.id})">${img}</div>
      <div class="h-info">
        <div class="h-name" onclick="goProduct(${h.id})">${escapeHtml(h.name)}</div>
        <div class="h-price">¥${Number(h.price).toLocaleString()}</div>
        <div class="h-time">${escapeHtml(fmtTime(h.time))}</div>
      </div>
      <div class="h-actions"><button class="h-del" onclick="deleteHistory(${h.id}, this)"><i class="fas fa-trash-alt"></i> 删除</button></div>
    </div>`;
  });
  html += '</div>';
  $('#contentArea').innerHTML = html;
}

/** 浏览时间友好显示（本地时间，秒级即时格式化） */
function fmtTime(t) {
  if (!t) return '';
  const d = new Date(t);
  if (isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/** 从浏览历史跳回首页产品区 */
function goProduct(pid) {
  // 跳回首页产品区（首页渲染后自动定位到该产品详情）
  location.href = '/index.html#product-' + pid;
}

/** 删除单条浏览记录（本地同步操作，即时生效） */
function deleteHistory(pid, btn) {
  if (btn) btn.disabled = true;
  try {
    const list = getHistoryList().filter(h => h.id !== pid);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    showToast('✅ 已删除');
  } catch (e) { showToast('❌ 删除失败'); }
  renderHistory();
}

/** 清空全部浏览记录（本地同步操作，即时生效） */
function clearHistory() {
  if (!confirm('确定清空全部浏览记录吗？')) return;
  try {
    localStorage.removeItem(HISTORY_KEY);
    showToast('✅ 已清空');
  } catch (e) { showToast('❌ 清空失败'); }
  renderHistory();
}

function renderSecurity() {
  $('#contentArea').innerHTML = `
    <h2><i class="fas fa-shield-alt" style="color:var(--primary);"></i> 账户安全</h2>
    <div style="display:flex;flex-direction:column;gap:16px;max-width:400px;">
      <div style="padding:16px;background:#FAF7F2;border-radius:8px;display:flex;justify-content:space-between;align-items:center;">
        <div><strong>用户名</strong><p style="color:var(--text-light);font-size:0.85rem;">${currentUser.username}</p></div>
      </div>
      <div style="padding:16px;background:#FAF7F2;border-radius:8px;display:flex;justify-content:space-between;align-items:center;">
        <div><strong>手机号</strong><p style="color:var(--text-light);font-size:0.85rem;">${currentUser.phone||'未绑定'}</p></div>
      </div>
      <hr style="border-color:var(--border);">
      <button class="btn btn-danger" onclick="deleteAccount()"><i class="fas fa-exclamation-triangle"></i> 注销账户</button>
      <p style="font-size:0.8rem;color:var(--text-light);">注销后个人信息将被清除，订单记录保留（匿名化），此操作不可恢复。</p>
    </div>`;
}

async function deleteAccount() {
  if (!confirm('确定要注销账户吗？\n\n个人信息将被清除\n购物车数据清空\n订单记录保留（匿名化）\n\n此操作不可恢复！')) return;
  let r = await fetch(API + '/user/account?user_id=' + currentUser.id, {method:'DELETE'});
  let d = await r.json();
  alert(d.message);
  localStorage.removeItem('yatan_user');
  location.href = '/index.html';
}

function doLogout() {
  if (confirm('确定退出登录？')) {
    localStorage.removeItem('yatan_user');
    location.href = '/index.html';
  }
}

updateSidebar();
renderProfile();
</script>
</body>
</html>
